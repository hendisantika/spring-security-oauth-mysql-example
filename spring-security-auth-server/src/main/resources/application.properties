server.port=8081
server.servlet.context-path=/auth

spring.application.name=spring-security-auth-server

spring.datasource.url=jdbc:mysql://localhost:3306/oauth2?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Registered OAuth2 client (spring-security-client)
app.oauth2.client.id=ClientId
app.oauth2.client.secret=secret
app.oauth2.client.redirect-uri=http://127.0.0.1:8082/ui/login/oauth2/code/auth-server

# Demo user seeded on startup
app.seed.enabled=true
app.seed.username=hendi
app.seed.password=password
